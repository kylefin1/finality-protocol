name: Release artifact, Sigstore bundle, and SLSA provenance

on:
  push:
    tags: ["external-proof-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.subject.outputs.hashes }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Verify before packaging
        run: make test
      - name: Build deterministic source archive
        run: |
          mkdir -p artifacts
          tar --sort=name --mtime='UTC 2026-08-30' --owner=0 --group=0 \
            --numeric-owner --exclude=.git --exclude=artifacts \
            -czf artifacts/finality-external-proof.tar.gz .
      - name: Calculate provenance subject
        id: subject
        shell: bash
        run: echo "hashes=$(sha256sum artifacts/finality-external-proof.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad
      - name: Keyless sign release artifact
        run: cosign sign-blob --yes artifacts/finality-external-proof.tar.gz --bundle artifacts/finality-external-proof.tar.gz.sigstore.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: signed-release-artifact
          path: |
            artifacts/finality-external-proof.tar.gz
            artifacts/finality-external-proof.tar.gz.sigstore.json
          if-no-files-found: error

  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: false
