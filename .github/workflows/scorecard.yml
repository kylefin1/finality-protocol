name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "23 5 * * 2"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Supply-chain hygiene scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@fddeee1a7ece751b577e409a89057319e3172939
        with:
          sarif_file: results.sarif

# Scorecard is supply-chain hygiene evidence only. It is not independent
# assurance of the Finality Reality Protocol.
